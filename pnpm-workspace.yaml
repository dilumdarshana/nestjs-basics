packages:
  - auth
  - carval
  - di
  - event_emitter
  - execution_order
  - k6
  - messages
  - prometheus

# Allow postinstall/build scripts for packages that need them (pnpm blocks them by default)
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  sqlite3: true
  esbuild: true
  '@swc/core': true
  argon2: true
  unrs-resolver: true
