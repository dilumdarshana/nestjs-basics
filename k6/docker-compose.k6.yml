name: nest-concepts-k6

services:
  k6:
    build:
      context: .
      dockerfile: Dockerfile.k6
    container_name: nest-concepts-k6
    # Bridge networking + host-gateway lets the container reach the host app
    # via `host.docker.internal` on Linux, macOS, and Windows alike.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./test/k6:/scripts
      